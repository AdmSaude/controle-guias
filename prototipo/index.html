<body>
<!-- Protótipo do Controle de Guias v2: dados fictícios, sem banco. Fonte: controle-guias/prototipo/prototipo-v2.html (projeto local). -->
<title>Protótipo do Controle de Guias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: no celular, caixa de entrada de uma coluna com abas e botão flutuante; detalhes numa folha que sobe de baixo.
   No computador (1024px+), menu lateral fixo com a unidade e as seções, título e busca no topo, "Para fazer" em duas
   colunas (resolver agora | malotes), guias em linhas alinhadas como tabela e detalhe num painel à direita.
   Cada etapa tem uma cor fixa; o vermelho é só para problema. Amarelo tracejado = simulação do protótipo. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --surface-2:#e8efed; --hover:#f6faf9; --line:#d9e3e0; --line-strong:#b5c6c2;
  --fg:#10201e; --muted:#53655f; --faint:#8a9a96;
  --ink:#0d5b53; --ink-hover:#0a4842; --ink-soft:#e1f0ec; --on-ink:#ffffff; --focus:#2563eb;
  --s1:#55647a; --s1-soft:#e8ecf2;
  --s2:#1f5fbf; --s2-soft:#e2ecfb;
  --s3:#6b3fc4; --s3-soft:#eee8fa;
  --s5:#0a7489; --s5-soft:#dcf1f5;
  --s6:#1e7b3e; --s6-soft:#e0f3e5;
  --end:#667085; --end-soft:#eceef1;
  --bad:#b42318; --bad-soft:#fdecea; --bad-tint:#fff7f6; --bad-line:#f0b2ab; --on-bad:#ffffff;
  --warn:#a14a06; --warn-soft:#fcefdf;
  --sim:#7a5d00; --sim-soft:#fbf3d6;
  --shadow:0 1px 2px rgba(16,32,30,.06),0 6px 18px rgba(16,32,30,.07);
  --scrim:rgba(10,22,20,.45);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Manrope','Inter',system-ui,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:12px;
  color-scheme:light;
}
/* Sempre claro: o usuário não quis o tema escuro (25/11/2026), mesmo com o computador no modo escuro. */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.travado{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
b{font-weight:650}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1180px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* barra do protótipo */
.proto{background:var(--sim-soft);border-bottom:1px dashed var(--sim);color:var(--sim)}
.proto .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-block:6px;font-size:13px}
.proto-tag{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.proto label{display:flex;align-items:center;gap:6px;color:var(--fg);font-weight:600}
.proto select{min-height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 8px;max-width:min(58vw,260px)}
.pbtn{min-height:34px;border:1px dashed var(--sim);background:transparent;color:var(--sim);border-radius:8px;padding:0 10px;cursor:pointer;font-weight:650;font-size:13px}
.proto .esp{flex:1 1 0}

/* topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topo .wrap{padding-block:12px 0;display:grid;gap:10px}
.topo-l1{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;justify-content:space-between}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca-ic{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.marca h1{font-size:17px;font-weight:750;line-height:1.2}
.marca small{display:block;color:var(--muted);font-size:12.5px}
.busca{position:relative;flex:1 1 260px;max-width:400px}
.busca input{width:100%;min-height:44px;border:1px solid var(--line-strong);border-radius:11px;background:var(--surface-2);padding:0 12px 0 40px}
.busca > .ic{position:absolute;left:12px;top:13px;color:var(--muted)}
.busca-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:62vh;overflow:auto;z-index:25}
.res{display:grid;gap:2px;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.res:last-child{border-bottom:0}
.res:hover{background:var(--surface-2)}
.res small{color:var(--muted)}
.abas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.aba{border:0;background:none;padding:10px 12px 11px;font-weight:650;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:7px;align-items:center}
.aba[aria-current="page"]{color:var(--fg);border-bottom-color:var(--ink)}
@media (max-width:420px){ .aba{padding-inline:8px;font-size:14.5px;gap:5px} }
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:var(--on-bad);font-size:12px;font-weight:700;display:inline-grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}

/* casca: no computador, menu lateral + área; no celular, só a área (o menu some e as abas ficam no topo) */
.lado,.pg,.resumo-f,.lista-h,.d-only{display:none}
.g-onde:empty{display:none}
.lado-marca{display:flex;align-items:center;gap:10px;padding:2px 6px}
.lado-marca b{font-family:var(--display);font-size:15.5px;font-weight:800;display:block;line-height:1.2}
.lado-marca small{display:block;color:var(--muted);font-size:12px}
.lado-un{border:1px solid var(--line);border-left:4px solid var(--u,var(--line-strong));border-radius:12px;padding:10px 12px;display:grid;gap:1px;background:var(--hover)}
.lado-un small{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.lado-un b{font-size:15px;line-height:1.3}
.lado-un span{font-size:12.5px;color:var(--muted)}
.navv{display:grid;gap:2px}
.navi{display:flex;align-items:center;gap:11px;min-height:42px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:650;font-size:14.5px;cursor:pointer;text-align:left;width:100%}
.navi:hover{background:var(--hover);color:var(--fg)}
.navi[aria-current="page"]{background:var(--ink-soft);color:var(--ink)}
.navi .t{flex:1;white-space:nowrap}
.navi .n{white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:650}
.navi .n.bad{color:var(--bad)}
.lado-pe{margin-top:auto;font-size:12.5px;color:var(--muted);display:grid;gap:6px;padding:12px 6px 0;border-top:1px solid var(--line)}
.lado-pe b{color:var(--fg);font-weight:650}
.pg h1{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
.pg p{color:var(--muted);font-size:14px;margin-top:3px}

/* seções da caixa de entrada */
main.wrap{padding-block:18px 120px;display:grid;gap:26px;align-content:start}
.sec{display:grid;gap:10px;min-width:0;scroll-margin-top:96px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-size:16px;color:var(--fg);font-weight:800;display:flex;gap:8px;align-items:center;letter-spacing:-.005em}
.sec-h h2 .ic{color:var(--bad)}
.cont{font-family:var(--font);font-variant-numeric:tabular-nums;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;letter-spacing:0}
.sec.bad .sec-h h2{color:var(--bad)}
.dica{font-size:13.5px;color:var(--muted)}
.dica.atr{color:var(--bad);font-weight:600}
.lista{display:grid;gap:8px;min-width:0}
.vazio{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--r)}

/* cartão de guia */
.g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 14px;padding:12px 14px}
.g.prob{border-color:var(--bad-line)}
.g-main{min-width:0;display:grid;gap:3px;cursor:pointer;border-radius:8px}
.g-l1{display:flex;flex-wrap:wrap;align-items:center;gap:5px 7px}
.g-nome{font-weight:650;font-size:15.5px}
.g-proc{color:var(--fg)}
.g-meta,.g-onde,.g-sit{color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.g-meta b,.g-onde b{color:var(--fg)}
.g-quem{display:grid;gap:2px;min-width:0}
.g-sit .st{flex-basis:100%}
.g-prob{color:var(--bad);font-size:13.5px;font-weight:550;display:flex;gap:6px;align-items:flex-start}
.g-prob .ic{width:16px;height:16px;margin-top:2px}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:.01em}
.g-acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:600px){ .g{grid-template-columns:minmax(0,1fr)} .g-acoes{justify-content:stretch} .g-acoes .btn{flex:1 1 auto} }

/* linha de etapas (1 a 6) */
.st{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:5px;max-width:220px}
.st i{height:5px;border-radius:3px;background:var(--line)}
.st i.f{background:var(--line-strong)}
.st i.c{background:var(--c)}
.st i.p{background:transparent;border:1px dashed var(--line-strong)}
.st-lab{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;font-size:10.5px;line-height:1.2;color:var(--muted);text-align:center;margin-top:3px}
.st-lab .c{color:var(--c);font-weight:700}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px 2px 8px;font-size:12.5px;font-weight:650;background:var(--cs);color:var(--c);line-height:1.35}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.selo{display:inline-flex;align-items:center;font-size:12px;font-weight:650;border-radius:6px;padding:1px 7px;border:1px solid var(--line-strong);color:var(--muted);background:var(--surface);line-height:1.4}
.selo.bad{border-color:var(--bad-line);background:var(--bad-soft);color:var(--bad)}
.selo.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.prazo{font-size:13px;font-weight:650;color:var(--muted)}
.prazo.hoje,.prazo.amanha{color:var(--warn)}
.prazo.atr{color:var(--bad)}

/* botões */
.btn{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none;font-size:14.5px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.pri:hover{background:var(--ink-hover)}
.btn.big{min-height:54px;font-size:16px;width:100%;white-space:normal}
.btn.sim{border-style:dashed;border-color:var(--sim);background:var(--sim-soft);color:var(--sim)}
.btn.fraco{border-color:transparent;background:none;color:var(--muted);padding:0 8px;min-height:36px}
.btn.fraco:hover{color:var(--fg);background:var(--surface-2)}
.btn.perigo{color:var(--bad);border-color:var(--bad-line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 8px 24px rgba(0,0,0,.22);min-height:54px;border-radius:27px;padding:0 20px;font-size:15.5px}

/* malotes e grupos */
.m{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center}
.m.parado{border-color:var(--bad-line)}
.m-main{display:flex;gap:12px;align-items:center;min-width:0;cursor:pointer;border-radius:8px}
.m-num{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.01em;background:var(--s2-soft);color:var(--s2);border-radius:8px;padding:6px 9px;flex:none}
.m-num.ubs{background:var(--s1-soft);color:var(--s1);font-family:var(--font);font-size:13px;padding:8px 9px}
.m-txt{min-width:0;display:grid;gap:2px}
.m-rota{font-weight:650}
.m-nomes{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.m-main > .m-txt{flex:1 1 auto}
.m-data{flex:none;margin-left:auto;display:grid;justify-items:end;text-align:right;line-height:1.15;padding-left:6px}
.m-data small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.m-data b{font-family:var(--display);font-size:19px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.m-data span{font-size:12.5px;color:var(--muted);font-weight:600}
.m.parado .m-data b{color:var(--bad)}
/* cores das unidades: etiqueta (rota do malote) e ponto (listas e painel) */
.rota{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px 6px;vertical-align:middle}
.rota .seta{color:var(--muted);font-weight:700;font-size:13px}
.un{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px 2px 8px;font-family:var(--font);font-size:13px;font-weight:700;line-height:1.4;letter-spacing:0;color:var(--u);background:var(--surface-2);background:color-mix(in srgb,var(--u) 10%,var(--surface));border:1px solid var(--line);border-color:color-mix(in srgb,var(--u) 30%,var(--surface))}
.un::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--u);flex:none}
.un.para{background:var(--u);border-color:var(--u);color:#fff}
.un.para::before{background:#fff}
.un-d{display:inline-flex;align-items:center;gap:6px}
.un-d::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--u);flex:none}
.res small .rota{display:inline-flex}
/* celular e tablet: número e data na primeira linha, rota inteira embaixo (igual aos cartões do computador) */
@media (max-width:1023px){
  .m-main:has(> .m-data){display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"num data" "txt txt";align-items:start;gap:8px 12px}
  .m-main:has(> .m-data) > .m-num{grid-area:num}
  .m-main:has(> .m-data) > .m-data{grid-area:data}
  .m-main:has(> .m-data) > .m-txt{grid-area:txt}
}
@media (max-width:600px){ .m{grid-template-columns:minmax(0,1fr)} .m .btn{width:100%} }

/* folha (detalhe e ações) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .15s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:sobe .18s ease}
@media (min-width:720px){ .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(660px,94vw);border-radius:16px;max-height:88vh;animation:none;padding-left:22px;padding-right:22px} }
@media (min-width:1024px){
  .sheet{left:auto;right:0;top:0;bottom:0;transform:none;width:min(620px,46vw);height:100%;max-height:none;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));box-shadow:-14px 0 44px rgba(16,32,30,.16);animation:entra .18s ease}
  .scrim{background:rgba(10,22,20,.22)}
  .sh-h{padding-top:20px}
}
@keyframes entra{from{transform:translateX(28px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 0 12px;z-index:2;border-bottom:1px solid var(--line)}
.sh-tt{display:grid;gap:4px;min-width:0}
.sh-h h3{font-size:19px;font-weight:750;line-height:1.25}
.sh-h h3:focus{outline:none}
.sh-b{display:grid;gap:18px;padding-block:16px}
.sh-pad{height:calc(8px + env(safe-area-inset-bottom,0px))}
.sh-f{position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px;z-index:2}
.sh-sub{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:750;margin-bottom:8px}
@keyframes sobe{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

.agora{border-radius:14px;padding:14px;background:var(--cs);display:grid;gap:5px}
.agora .rot{color:var(--c);font-weight:750;font-size:16.5px;line-height:1.3}
.agora .st{max-width:none;margin-top:8px}
.agora .st i{height:7px}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.acoes .btn{flex:1 1 auto}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.info div{min-width:0}
.info dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.info dd{margin:2px 0 0;font-weight:550;overflow-wrap:anywhere;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pbox{border:1px solid var(--bad-line);background:var(--bad-soft);border-radius:12px;padding:12px;display:grid;gap:8px}
.pbox strong{color:var(--bad)}
.pbox small{color:var(--muted)}
.simbox{border:1px dashed var(--sim);background:var(--sim-soft);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.simlab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--sim);font-weight:800}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.hist li:first-child time{color:var(--fg);font-weight:650}
.hist time{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.hist .por{display:block;color:var(--muted);font-size:12.5px}

/* formulários */
.campo{display:grid;gap:6px;min-width:0}
.campo label,.campo .lab{font-weight:650;font-size:14px}
.op{font-weight:400;color:var(--muted)}
.campo input,.campo select,.campo textarea{min-height:48px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 12px;width:100%;min-width:0}
.campo textarea{padding:10px 12px;min-height:84px;resize:vertical}
.erro{color:var(--bad);font-size:13px;font-weight:600}
.achou{font-size:13.5px;color:var(--muted)}
.achou.ok{color:var(--s6)}
.achou.ja{color:var(--warn)}
.ex-prot{display:block;margin-top:8px;padding:8px 10px;border:1px dashed var(--sim);background:var(--sim-soft);color:var(--sim);border-radius:10px;font-size:13px;font-weight:600}
.ex-b{display:inline-flex;align-items:center;min-height:32px;margin:6px 6px 0 0;padding:0 10px;border:1px solid var(--sim);border-radius:8px;background:var(--surface);color:var(--sim);font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer}
.ex-b:hover{background:var(--sim-soft)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grade2{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);border-radius:12px;padding:3px;gap:3px;background:var(--surface-2)}
.seg button{min-height:44px;border:0;border-radius:9px;background:none;font-weight:650;color:var(--muted);cursor:pointer;padding:4px 8px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-weight:550}
.tog input{width:22px;height:22px;accent-color:var(--ink)}
.radios{display:grid;gap:2px}
.radios label{display:flex;gap:10px;align-items:center;min-height:42px;cursor:pointer;font-weight:500}
.radios input{width:20px;height:20px;accent-color:var(--ink)}
details.mais{border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.mais summary{min-height:46px;display:flex;align-items:center;cursor:pointer;font-weight:650}
details.mais[open]{padding-bottom:12px}
details.mais > div{display:grid;gap:14px}

/* conferência de malote */
.conf{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.conf-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.conf-i:last-child{border-bottom:0}
.conf-i input[type=checkbox]{width:24px;height:24px;accent-color:var(--ink);margin:0}
.conf-t{display:grid;gap:1px;min-width:0;cursor:pointer}
.conf-t .nome{font-weight:650}
.conf-t small{color:var(--muted);font-size:13px}
.conf-t .falta{color:var(--bad);font-weight:650}
.conf-i.faltou{background:var(--bad-soft)}
.conf-i.faltou .nome{text-decoration:line-through;color:var(--bad)}
.conf-i.outra{background:var(--warn-soft)}
.conf-i select{min-height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);max-width:170px;padding:0 6px}
.conf-x{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.conf-x .btn.fraco{font-size:13px;padding:0 6px}
@media (max-width:480px){ .conf-i.outra .conf-x{grid-column:2 / -1;justify-content:flex-start} }
.novo-form{border:1px dashed var(--line-strong);border-radius:12px;padding:12px;display:grid;gap:12px}

/* protocolo em papel */
.papel{border:1px solid var(--line-strong);border-radius:6px;padding:16px;background:var(--surface);font-size:13.5px;display:grid;gap:12px}
.papel-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fg);padding-bottom:10px}
.pk{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pn{font-family:var(--mono);font-size:28px;font-weight:800;letter-spacing:.04em;line-height:1.1}
.pr{text-align:right;font-size:13px}
.papel ol{margin:0;padding-left:24px;display:grid;gap:3px}
.assin{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.assin span{border-top:1px solid var(--fg);padding-top:4px;font-size:12px;color:var(--muted)}
/* etiqueta do envelope (tela e papel) */
.etq{border:2px solid var(--fg);border-radius:12px;padding:14px 16px;display:grid;gap:10px;background:var(--surface)}
.etq-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.etq-num{font-family:var(--mono);font-size:44px;font-weight:800;letter-spacing:.05em;line-height:1.05;text-align:center}
.etq-grade{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;border-top:1px solid var(--line-strong);padding-top:10px}
.etq-grade small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.etq-grade b{font-size:16px;line-height:1.25;display:block}
.etq-q{text-align:center;border-left:1px solid var(--line-strong);padding-left:14px}
.etq-q b{font-family:var(--mono);font-size:30px;line-height:1.05}
.etq-rod{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.etq-urg{color:var(--bad);font-weight:700}
@media (max-width:420px){ .etq-top span:last-child{display:none} .etq-num{font-size:38px} .etq-grade{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .etq-q{grid-column:1 / -1;border-left:0;padding-left:0;border-top:1px solid var(--line-strong);padding-top:8px;display:flex;gap:10px;align-items:baseline;justify-content:center} }

/* folha impressa: etiqueta para recortar + protocolo. Sempre preto no branco. */
.folha{--fg:#000;--muted:#333;--line:#999;--line-strong:#000;--surface:#fff;--bad:#000;color:#000;background:#fff;font-family:var(--font);font-size:11pt;line-height:1.35;width:186mm;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.folha .corte{border:1.5px dashed #000;padding:3mm 4mm 4mm;width:150mm;margin:0 auto}

.folha .etq{border-radius:3mm}
.folha .etq-top span:last-child{display:inline}
.folha .etq-num{font-size:40pt}
.folha .etq-grade{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.folha .etq-grade b{font-size:14pt}
.folha .etq-q{grid-column:auto;display:block;border-top:0;border-left:1px solid #000;padding:0 0 0 4mm}
.folha .etq-q b{font-size:28pt}
.folha .etq-rod{font-size:10pt;color:#000}
.folha .etq-urg{text-decoration:underline}
.prot{margin-top:9mm;display:grid;gap:3.5mm}
.prot-h{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;border-bottom:2px solid #000;padding-bottom:2.5mm}
.prot-h small{display:block;font-size:8.5pt;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.prot-num{font-family:var(--mono);font-size:20pt;font-weight:800}
.prot-r{text-align:right;font-size:10pt}
.prot table{width:100%;border-collapse:collapse;font-size:10pt}
.prot th,.prot td{border:1px solid #000;padding:1.5mm 2mm;text-align:left;vertical-align:top}
.prot th{font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;background:#ececec}
.prot td small{display:block;font-size:8.5pt;color:#333}
.prot td small.tags{font-weight:700;color:#000}
.prot .n,.prot .ck{text-align:center;width:11mm}
.prot .mono{font-family:var(--mono);font-size:9pt;white-space:nowrap}
.prot .box{display:inline-block;width:4.5mm;height:4.5mm;border:1.3px solid #000;vertical-align:middle}
.prot tr{break-inside:avoid}
.prot tfoot td{font-weight:700;background:#f4f4f4}
.prot-nota{font-size:9.5pt}
.prot-ass{display:grid;grid-template-columns:2fr 1fr;gap:11mm 8mm;margin-top:9mm}
.prot-ass div{border-top:1px solid #000;padding-top:1mm;font-size:9pt}
.previa{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6mm 0}
#impressao{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  body::before{display:none!important}
  #app,#sheet,#toast-root{display:none!important}
  #impressao{display:block!important}
}

.resumo{display:flex;flex-wrap:wrap;gap:8px}

.cel{border:0;background:none;cursor:pointer;width:100%;border-radius:8px;padding:5px 4px;display:grid;gap:1px;justify-items:center;min-height:44px}

.fchip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

.filtros select{min-height:42px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 10px;max-width:100%}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 10px 8px 16px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100vw - 32px);box-shadow:var(--shadow);font-size:14px;font-weight:550}

.tarefas h4{font-size:15px;margin-bottom:8px}

/* ---------- computador: menu lateral, área larga, linhas alinhadas ---------- */
@media (min-width:1024px){
  .m-only{display:none!important}
  .fab{display:none}
  /* largura do menu, margem da área e coluna de botões: menores entre 1024 e 1365 px (notebook ou monitor com zoom) */
  .shell{--lado:232px;--pad:24px;--acoes:384px;--cg:16px}
  @media (min-width:1366px){ .shell{--lado:252px;--pad:32px;--acoes:396px;--cg:24px} }
  .shell{display:grid;grid-template-columns:var(--lado) minmax(0,1fr);align-items:start;background:linear-gradient(90deg,var(--surface) 0 calc(var(--lado) - 1px),var(--line) calc(var(--lado) - 1px) var(--lado),transparent var(--lado))}
  .lado{display:flex;flex-direction:column;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding-block:18px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}

  .rf{position:relative;overflow:hidden;display:grid;align-content:start;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px 12px 19px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;line-height:1.3;box-shadow:0 1px 2px rgba(16,32,30,.04);transition:border-color .15s,box-shadow .15s,transform .15s}

/* lista em painel, linhas alinhadas pelas mesmas colunas (subgrid). A coluna de botões tem a mesma
   largura em todas as seções, para as colunas baterem de uma seção para a outra. Abaixo de 1200 px
   as guias continuam em cartões, que cabem melhor. */
@media (min-width:1200px){
  .lista{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.9fr) var(--acoes);column-gap:var(--cg);row-gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(16,32,30,.04)}
  .lista > *{grid-column:1 / -1}

  .lista > .btn.big{margin:14px 18px 16px;width:auto}
  .lista > .vazio{border:0;border-radius:0}
  .lista:has(> .lista-h){grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.9fr) auto}
  .lista > .g{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.9fr) var(--acoes);grid-template-columns:subgrid;border:0;border-radius:0;border-top:1px solid var(--line);padding:14px 18px;align-items:center}
  .lista > .g:first-child,.lista > .lista-h + .g,.lista > .dica + .g{border-top:0}
  .lista > .dica + .g{margin-top:6px}
  .lista > .g:hover{background:var(--hover)}
  .lista > .g.prob{background:var(--bad-tint)}
  .lista > .g > .g-main{grid-column:1 / 4;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.9fr);grid-template-columns:subgrid;align-items:center;gap:6px var(--cg)}
  .lista > .g > .g-acoes{grid-column:4}
  .lista .g-acoes .btn{min-height:38px;padding:0 12px;font-size:14px;gap:6px}
  .lista .g-onde:empty{display:flex}
  .lista .g-onde,.lista .g-sit{flex-direction:column;align-items:flex-start;gap:3px}
  .lista .g-sit .st{flex-basis:auto;width:100%;max-width:200px;margin-top:2px}
  .lista-h{display:grid;grid-template-columns:subgrid;padding:10px 18px;background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
  .lista-h span:first-child{grid-column:1}
  .lista > .m{border:0;border-radius:0;border-top:1px solid var(--line);padding:14px 18px}
  .lista > .m:first-child,.lista > .dica + .m{border-top:0}
  .lista > .m:hover{background:var(--hover)}
}

/* malotes em cartões lado a lado (depois do painel, para valer sobre ele) */
@media (min-width:1024px){
  .lista.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;background:none;border:0;border-radius:0;overflow:visible;box-shadow:none}
  .lista.grade > *{grid-column:auto}
  .lista.grade > .m{grid-template-columns:minmax(0,1fr);align-content:space-between;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:0 1px 2px rgba(16,32,30,.04)}
  .lista.grade > .m.parado{border-color:var(--bad-line)}
  /* cartão de malote: número e data na primeira linha, rota inteira embaixo */
  .lista.grade .m-main{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"num data" "txt txt";align-items:start;gap:10px 12px}
  .lista.grade .m-main > .m-num{grid-area:num}
  .lista.grade .m-main > .m-data{grid-area:data}
  .lista.grade .m-main > .m-txt{grid-area:txt}
  .lista.grade .m-main:not(:has(> .m-data)){display:flex}
  .lista.grade .m-num.ubs{display:none}
  .lista.grade .m-rota{font-family:var(--display);font-size:15.5px;font-weight:800;line-height:1.3}
  .lista.grade > .m > .btn{width:100%}
  .lista.grade > .vazio,.lista.grade > .dica,.lista.grade > .btn.big{grid-column:1 / -1}
  .lista.grade > .vazio{border:1px dashed var(--line-strong);border-radius:var(--r)}
}

  if (g.etapa === 'ag_agendada') return g.avisado ? 'Agendada e avisada: esperando o malote para a UBS' : 'Agendada: falta avisar o paciente';
  return E[g.etapa].rot;

// semData: o cartão já mostra a data no canto (dataMalote); o detalhe do malote continua com ela no texto.

// Data do malote em destaque, no canto de cima à direita (pedido do usuário, 25/11/2026):

function dataMalote(m) {
  const iso = m.recebidoEm || m.fechadoEm, d = new Date(iso);
  const dif = Math.round((dia0(new Date()) - dia0(d)) / 864e5);
  const rel = dif === 0 ? 'hoje' : dif === 1 ? 'ontem' : DS[d.getDay()];
  return '<div class="m-data"><small>' + (m.recebidoEm ? 'Recebido' : 'Saiu') + '</small><b>' + p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '</b><span>' + rel + ' ' + fHora(d) + '</span></div>';
}
function maloteCard(m, acao) {

/* ------------------------------------------------------------------ caixas de entrada */
function listasUBS(me) {
  const chegando = S.malotes.filter(m => m.destino === me && !m.recebidoEm).sort((a, b) => a.fechadoEm < b.fechadoEm ? -1 : 1);
  const prob = S.guias.filter(g => !fim(g) && temProblema(g) && (
    (g.etapa === 'ubs_paciente' && g.holder === me) ||
    ((g.etapa === 'malote_ida' || g.etapa === 'malote_volta') && abertos(g).some(p => p.motivo === 'Faltou no malote') && M(g.maloteId) && (M(g.maloteId).origem === me || M(g.maloteId).destino === me))));
  const pid = new Set(prob.map(g => g.id));
  const aqui = S.guias.filter(g => g.holder === me && !pid.has(g.id));
  const reforcar = aqui.filter(g => g.etapa === 'ubs_paciente' && precisaReforco(g)).sort(porPrazo);
  const mandar = aqui.filter(g => g.etapa === 'ubs_mandar').sort(porInicio);
  const esperando = aqui.filter(g => g.etapa === 'ubs_paciente' && reforcar.indexOf(g) < 0).sort(porPrazo);
  const aguard = aqui.filter(g => g.etapa === 'nao_retirou');
  const enviados = S.malotes.filter(m => m.origem === me && !m.recebidoEm);
  return { chegando, prob, reforcar, mandar, esperando, aguard, enviados, badge: chegando.length + prob.length + reforcar.length };
}
function listasAG() {
  const chegando = S.malotes.filter(m => m.destino === AG && !m.recebidoEm).sort((a, b) => a.fechadoEm < b.fechadoEm ? -1 : 1);
  const prob = S.guias.filter(g => !fim(g) && temProblema(g) && (
    g.etapa === 'ag_agendar' || g.etapa === 'ag_fila' || (g.etapa === 'ag_agendada' && !g.avisado) ||
    ((g.etapa === 'malote_ida' || g.etapa === 'malote_volta') && abertos(g).some(p => p.motivo === 'Faltou no malote'))));
  const pid = new Set(prob.map(g => g.id));
  const decidir = S.guias.filter(g => g.etapa === 'nao_retirou');
  const agendar = S.guias.filter(g => g.etapa === 'ag_agendar' && !pid.has(g.id)).sort((a, b) => (b.urgente - a.urgente) || porInicio(a, b));
  const avisar = S.guias.filter(g => g.etapa === 'ag_agendada' && !g.avisado && !pid.has(g.id)).sort((a, b) => (b.urgente - a.urgente) || porInicio(a, b));
  const porUbs = {};
  S.guias.filter(g => g.etapa === 'ag_agendada' && g.avisado).forEach(g => { (porUbs[g.ubs] = porUbs[g.ubs] || []).push(g); });
  const grupos = UBS.filter(u => porUbs[u.id]).map(u => [u.id, porUbs[u.id].sort(porInicio)]);
  const fila = S.guias.filter(g => g.etapa === 'ag_fila').sort(porInicio);
  return { chegando, prob, decidir, agendar, avisar, grupos, fila, badge: chegando.length + prob.length + decidir.length + agendar.length + avisar.length + grupos.length };
}
function acoesProb(g) {

  if (p.motivo === 'Faltou no malote' && m) {
    if (m.origem === S.papel) h += btn('achei', g.id, 'Achei aqui: vai no próximo malote', 'pri');

  } else if (g.etapa === 'ubs_paciente' && g.holder === S.papel) {

  return h + btn('resolver', g.id, 'Resolver', '', ' data-p="' + p.id + '"');
}

  if (L.aguard.length) h += sec('Não retirou: esperando o Agendamento', L.aguard.length, L.aguard.map(g => card(g, '')).join(''), '', 'O Agendamento vai dizer se a guia volta ou fica arquivada aqui. Guarde o papel até lá.', { id: 'sec-aguard' });

/* ------------------------------------------------------------------ onde parou, guias, malotes */
function painel() {
  const abertas = S.guias.filter(g => !fim(g));
  const atr = abertas.filter(atrasada).length, pr = abertas.filter(temProblema).length;
  const caminho = S.malotes.filter(m => !m.recebidoEm); const parados = caminho.filter(m => du(m.fechadoEm, new Date()) >= 2).length;
  let h = '<section class="sec"><div class="sec-h m-only"><h2>Onde parou</h2></div><div class="resumo">' +
    '<button type="button" class="rchip' + (atr ? ' bad' : '') + '" data-act="filtro-geral" data-k="atrasadas"><b>' + atr + '</b> atrasadas</button>' +
    '<button type="button" class="rchip' + (pr ? ' bad' : '') + '" data-act="filtro-geral" data-k="problema"><b>' + pr + '</b> com problema</button>' +
    '<button type="button" class="rchip' + (parados ? ' bad' : '') + '" data-act="tab" data-tab="malotes"><b>' + caminho.length + '</b> malotes a caminho' + (parados ? ', ' + parados + ' parado' + (parados > 1 ? 's' : '') : '') + '</button>' +
    '</div><p class="dica">Cada linha é uma UBS; cada coluna, uma etapa. O número mostra quantas guias da UBS estão ali. Em vermelho, as que passaram de 2 dias úteis. Toque no número para ver a lista.</p>';
  h += '<div class="tab-scroll"><table class="painel"><thead><tr><th>UBS</th>' + COLS.map(c => '<th><span class="dot" style="' + cv(c.cor) + '"></span>' + c.rot + '</th>').join('') + '<th>Com problema</th></tr></thead><tbody>';
  const tot = COLS.map(() => ({ n: 0, a: 0 })); const totP = { n: 0 };
  UBS.forEach(u => {
    h += '<tr><td>' + unDot(u.id, false) + '</td>';
    COLS.forEach((c, i) => {
      const gs = abertas.filter(g => c.un(g) === u.id); const a = gs.filter(atrasada).length;
      tot[i].n += gs.length; tot[i].a += a;
      h += '<td>' + celula(gs, a, c, u.id) + '</td>';
    });
    const gp = abertas.filter(g => temProblema(g) && (g.ubs === u.id || g.holder === u.id)); totP.n += gp.length;
    h += '<td>' + (gp.length ? '<button type="button" class="cel" data-act="cel" data-k="problema" data-u="' + u.id + '"><span class="n" style="color:var(--bad)">' + gp.length + '</span></button>' : '<span class="cel zero"><span class="n">·</span></span>') + '</td></tr>';
  });
  h += '</tbody><tfoot><tr><td>Total</td>' + tot.map((t, i) => '<td><button type="button" class="cel" data-act="cel" data-k="' + COLS[i].k + '"><span class="n">' + t.n + '</span>' + (t.a ? '<span class="sub atr">' + t.a + ' atrasada' + (t.a > 1 ? 's' : '') + '</span>' : '') + '</button></td>').join('') +
    '<td><span class="cel"><span class="n">' + totP.n + '</span></span></td></tr></tfoot></table></div></section>';
  return h;
}
function celula(gs, a, c, u) {
  if (!gs.length) return '<span class="cel zero"><span class="n">·</span></span>';
  let sub;
  if (a) sub = '<span class="sub atr">' + a + ' atrasada' + (a > 1 ? 's' : '') + '</span>';
  else if (c.semPrazo) sub = '<span class="sub">sem prazo</span>';
  else { const d = du(gs.reduce((x, g) => inicioEtapa(g) < x ? inicioEtapa(g) : x, inicioEtapa(gs[0])), new Date()); sub = '<span class="sub">' + (d <= 0 ? 'desde hoje' : 'mais antiga ' + d + 'd') + '</span>'; }
  return '<button type="button" class="cel" data-act="cel" data-k="' + c.k + '" data-u="' + u + '"><span class="n">' + gs.length + '</span>' + sub + '</button>';
}
function guiasVisiveis() {
  if (!isUBS()) return S.guias;
  const me = S.papel;
  return S.guias.filter(g => g.ubs === me || g.holder === me || (g.maloteId && M(g.maloteId) && (M(g.maloteId).origem === me || M(g.maloteId).destino === me)));
}
function telaGuias() {
  const f = S.filtro || {}; const k = f.k || 'abertas';
  const chips = [['abertas', 'Abertas'], ['atrasadas', 'Atrasadas'], ['problema', 'Com problema']].concat(COLS.map(c => [c.k, c.rot])).concat([['encerradas', 'Encerradas']]);
  let lista = guiasVisiveis();
  const col = COLS.find(c => c.k === k);
  if (col) lista = lista.filter(g => { const un = col.un(g); return un != null && (!f.u || un === f.u); });
  else {
    if (k === 'abertas') lista = lista.filter(g => !fim(g));
    if (k === 'atrasadas') lista = lista.filter(g => !fim(g) && atrasada(g));
    if (k === 'problema') lista = lista.filter(g => !fim(g) && temProblema(g));
    if (k === 'encerradas') lista = lista.filter(fim);
    if (f.u) lista = lista.filter(g => g.ubs === f.u || g.holder === f.u);
  }
  lista = k === 'encerradas' ? lista.sort((a, b) => a.desde < b.desde ? 1 : -1) : lista.sort((a, b) => (atrasada(b) - atrasada(a)) || porInicio(a, b));
  let h = '<section class="sec"><div class="sec-h m-only"><h2>Guias <span class="cont">' + lista.length + '</span></h2></div><div class="filtros"><div class="chips">' +
    chips.map(([kk, t]) => '<button type="button" class="fchip" data-act="filtro" data-k="' + kk + '" aria-pressed="' + (kk === k) + '">' + esc(t) + '</button>').join('') + '</div>';
  if (!isUBS()) h += '<label class="campo" style="max-width:320px"><span class="lab">UBS</span><select id="filtro-ubs" data-act="filtro-ubs"><option value="">Todas as UBS</option>' + UBS.map(u => '<option value="' + u.id + '"' + (f.u === u.id ? ' selected' : '') + '>' + esc(u.nome) + '</option>').join('') + '</select></label>';
  const cab = '<div class="lista-h"><span>Paciente e exame · ' + plural(lista.length, 'guia', 'guias') + '</span><span>Atendimento e onde está</span><span>Situação e prazo</span><span></span></div>';
  h += '</div><div class="lista">' + (lista.length ? cab + lista.map(g => card(g, '', true)).join('') : vazio('Nenhuma guia com esse filtro.')) + '</div></section>';
  return h;
}

  const caminho = base.filter(m => !m.recebidoEm).sort((a, b) => a.fechadoEm < b.fechadoEm ? -1 : 1);

function buscar(q) {
  const box = $('#busca-res'); if (!box) return;
  const t = norm(q.trim()); if (t.length < 2) { box.hidden = true; box.innerHTML = ''; return; }
  const dg = digitos(t);
  const ms = (isUBS() ? S.malotes.filter(m => m.origem === S.papel || m.destino === S.papel) : S.malotes).filter(m => norm(m.num).indexOf(t) >= 0 || (dg.length >= 2 && dg === t && m.num.slice(4).indexOf(dg) >= 0)).slice(0, 3);
  const gs = guiasVisiveis().filter(g => norm(g.paciente).indexOf(t) >= 0 || (dg.length >= 4 && digitos(g.protocolo).indexOf(dg) >= 0)).slice(0, 8);
  let h = ms.map(m => '<button type="button" class="res" data-act="malote" data-id="' + m.id + '"><b>Malote ' + m.num + '</b><small>' + rotaHTML(m) + ' · ' + (m.recebidoEm ? 'recebido' : 'a caminho') + '</small></button>').join('');
  h += gs.map(g => '<button type="button" class="res" data-act="guia" data-id="' + g.id + '"><b>' + esc(g.paciente) + '</b><small>' + esc(g.proc) + '</small><span>' + chip(g) + '</span></button>').join('');
  box.innerHTML = h || '<div class="res" style="cursor:default"><small>Nada encontrado. Confira o nome ou o número.</small></div>';
  box.hidden = false;
}

function pintar(html, nova) {
  const root = $('#sheet'); const old = root.querySelector('.sheet');
  const top = old && !nova ? old.scrollTop : 0;
  const foco = document.activeElement && document.activeElement.id && old && old.contains(document.activeElement) ? document.activeElement.id : null;
  const memo = {};
  if (old && !nova) old.querySelectorAll('input[id],select[id],textarea[id]').forEach(e => {
    if (e.dataset.act) return; // caixas ligadas ao estado já saem certas do desenho
    memo[e.id] = (e.type === 'checkbox' || e.type === 'radio') ? { marcado: e.checked } : { valor: e.value };
  });
  root.innerHTML = '<div class="scrim" data-act="fechar-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-tit">' + html + '</div>';
  const s = root.querySelector('.sheet');
  Object.keys(memo).forEach(id => { const e = document.getElementById(id); if (!e || !s.contains(e)) return; if ('marcado' in memo[id]) e.checked = memo[id].marcado; else e.value = memo[id].valor; });
  s.scrollTop = top;
  document.body.classList.add('travado');
  if (foco && document.getElementById(foco)) document.getElementById(foco).focus({ preventScroll: true });
  else if (!old || nova) { const h = document.getElementById('sh-tit'); if (h) h.focus({ preventScroll: true }); }
}

// O protótipo não fala com o SIGSS: só conhece os 3 protocolos de FILA_SIGSS. Os exemplos viram botões
// que preenchem o campo, para o teste não travar num número de verdade (pedido do usuário, 25/11/2026).
const exemplosProt = () => '<span class="ex-prot">No protótipo não há ligação com o SIGSS: só estes 3 protocolos de exemplo existem. Toque num para testar: ' +
  Object.keys(FILA_SIGSS).map(k => '<button type="button" class="ex-b" data-act="ex-prot" data-v="' + k + '">' + k + '</button>').join('') + '</span>';
// Protocolo de acompanhamento do SIGSS: "LIES-" + número (tamanho variável) + "-" 1 dígito + "-" 2 dígitos,
// como LIES-132596-1-05 ou LIES-665-1-69 (conferido em 25/11/2026). Aceita sem o "LIES-" e em minúsculas.
const normProt = v => { const m = /^(?:LIES-?)?(\d+)-(\d)-(\d{2})$/.exec(String(v || '').toUpperCase().replace(/\s+/g, '')); return m ? 'LIES-' + m[1] + '-' + m[2] + '-' + m[3] : null; };
function procurarProtocolo(v) {
  const box = $('#n-achou'); if (!box) return; const cod = normProt(v);
  box.className = 'achou';
  if (!cod) { box.innerHTML = (String(v || '').trim() ? 'O protocolo de acompanhamento do SIGSS é assim: LIES-132596-1-05. ' : 'Digite o protocolo de acompanhamento (LIES-...) e o app completa o nome e o exame. ') + exemplosProt(); return; }
  const ja = S.guias.find(g => !fim(g) && g.protocolo && normProt(g.protocolo) === cod);
  if (ja) { box.className = 'achou ja'; box.innerHTML = '<b>Essa guia já está no app:</b> ' + esc(ja.paciente) + ', ' + esc(rotulo(ja).toLowerCase()) + '. ' + btn('guia', ja.id, 'Abrir', 'fraco'); return; }
  const k = Object.keys(FILA_SIGSS).find(x => normProt(x) === cod);
  if (k) {
    const f = FILA_SIGSS[k]; const p = $('#n-pac'), pr = $('#n-proc'); if (p && !p.value) p.value = f.paciente; if (pr && !pr.value) pr.value = f.proc;
    box.className = 'achou ok'; box.innerHTML = '<b>Achei na Lista de Espera do SIGSS:</b> ' + esc(f.paciente) + ' · ' + esc(f.proc);
  } else box.innerHTML = 'Não achei esse protocolo na Lista de Espera. Confira o número ou preencha à mão. ' + exemplosProt();
}

}

/* mensagem pronta para o paciente. O telefone vem do SIGSS quando esta tela abre (ou do que já está na guia); se não vier,
   a pessoa escreve e ele fica guardado na guia. O usuário liberou guardar (25/11/2026): o receio era só o tamanho do plano
   free, e telefone e dados da guia ocupam pouco. No protótipo, o "SIGSS" é o telefone fictício da guia. */
const DL = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
const fDiaPac = d => { d = new Date(d); return DL[d.getDay()] + ', ' + p2(d.getDate()) + '/' + p2(d.getMonth() + 1); };
const minusc = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : '';
function textoPronto(g) {
  const nome = g.paciente.split(' ')[0]; const proc = minusc(g.proc);
  const quando = g.ag ? fDiaPac(g.ag.quando) + ', às ' + fHora(g.ag.quando) + ', em ' + g.ag.local : '';
  const doc = 'Traga um documento com foto e o cartão do SUS.';
  const fecho = 'Se não puder ir, avise por esta conversa, para a vaga ficar para outra pessoa.';
  if (isAG()) {
    const ate = g.ag ? addDU(new Date(g.ag.quando), -1) : null;
    return 'Olá, ' + nome + '! Aqui é do Agendamento da Saúde.\n' +
      'Seu atendimento foi agendado: ' + proc + (quando ? ', ' + quando : '') + '.\n' +
      'A guia vai para a UBS ' + nomeUn(g.ubs) + '. Retire lá' + (ate ? ' até ' + fDiaPac(ate) : '') + '. ' + doc + '\n' + fecho;
  }
  const s = situacao(g); const venceu = g.etapa === 'nao_retirou' || (s && s.tipo === 'atr');
  return 'Olá, ' + nome + '! Aqui é da UBS ' + nomeUn(g.ubs) + '.\n' +
    'A guia de ' + proc + ' já chegou e está aqui na UBS.' + (quando ? '\nAtendimento: ' + quando + '.' : '') + '\n' +
    (venceu ? 'O prazo para retirar já passou: venha o quanto antes. ' : s ? 'Venha retirar até ' + fDiaPac(s.p) + '. ' : '') + doc + '\n' + fecho;
}
let msgErro = '';
function abrirMensagem(id) { sheetAtual = { tipo: 'mensagem', id }; R = F = N = null; msgErro = ''; desenharMensagem(true); }
function desenharMensagem(nova) {
  const g = G(sheetAtual.id);
  const html = head('Mensagem para o paciente', '<div class="g-meta"><span>' + esc(g.paciente) + '</span><span>' + esc(g.proc) + '</span></div>') +
    '<div class="sh-b"><div class="campo"><label for="msg-tel">Telefone (WhatsApp)</label><input id="msg-tel" type="tel" inputmode="tel" autocomplete="off" value="' + esc(g.tel) + '">' +
    (msgErro ? '<span class="erro">' + msgErro + '</span>' : '') +
    '<span class="dica">' + (g.tel ? 'Veio do SIGSS. Se estiver errado, corrija aqui.' : 'O SIGSS não trouxe telefone. Escreva aqui.') + ' O número fica guardado na guia para a próxima vez.</span></div>' +
    '<div class="campo"><label for="msg-txt">Texto pronto <span class="op">(dá para mudar antes de mandar)</span></label><textarea id="msg-txt" rows="11">' + esc(textoPronto(g)) + '</textarea></div>' +
    '<div class="simbox"><span class="simlab">Simulação do protótipo</span><p class="dica">No app de verdade, "Mandar no WhatsApp" abre o WhatsApp do computador ou do celular já com o número e o texto, e a pessoa só aperta enviar. Aqui o botão só registra o aviso.</p></div>' +
    '</div><div class="sh-f">' + btn('msg-whats', g.id, ic('chat') + 'Mandar no WhatsApp', 'pri big') + btn('msg-copiar', g.id, 'Copiar o texto', 'big') + '</div>';
  pintar(html, nova);
}
function mandarMensagem(id) {
  const g = G(id); const tel = digitos(valor('msg-tel'));
  if (tel.length < 10) { msgErro = 'Escreva o telefone com DDD.'; desenharMensagem(); focar('msg-tel'); return; }
  msgErro = '';
  // No app de verdade: window.open('https://wa.me/55' + tel.replace(/^55/, '') + '?text=' + encodeURIComponent(texto)).
  const novoTel = valor('msg-tel'); const q = q0(), por = quem();
  const guardarTel = () => { if (digitos(g.tel) !== tel) { ev(g, q, por, g.tel ? 'Telefone corrigido na mensagem' : 'Telefone escrito na mensagem'); g.tel = novoTel; } };
  if (isAG()) agir('Paciente avisado por WhatsApp: ' + g.paciente + '.', () => { guardarTel(); tAvisar(g, 'whats', q, por); }, () => fecharSheet());
  else agir('Aviso reforçado por WhatsApp: ' + g.paciente + '.', () => { guardarTel(); tReforcar(g, q, por, 'whats'); }, () => fecharSheet());
}
function copiarMensagem() {
  const t = valor('msg-txt'); const manual = () => { const e = document.getElementById('msg-txt'); if (e) e.select(); toast('Selecione o texto e copie.'); };
  try { navigator.clipboard.writeText(t).then(() => toast('Texto copiado. Cole no WhatsApp ou no SMS.'), manual); } catch (e) { manual(); }
}

/* ------------------------------------------------------------------ ações */
function agir(msg, fn, depois) {
  const snap = JSON.stringify(S); fn(); salvar(); render();
  if (depois) depois();
  else if (sheetAtual && sheetAtual.tipo === 'guia') desenharGuia();
  else if (sheetAtual && sheetAtual.tipo === 'malote') desenharMalote();
  toast(msg, snap);
}
function toast(msg, snap) {
  const root = $('#toast-root'); clearTimeout(toastT); desfazerSnap = snap || null;
  root.innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' + (snap ? '<button type="button" data-act="desfazer">Desfazer</button>' : '') + '</div>';
  toastT = setTimeout(() => { root.innerHTML = ''; desfazerSnap = null; }, snap ? 8000 : 3000);
}
function desfazer() { if (!desfazerSnap) return; S = JSON.parse(desfazerSnap); desfazerSnap = null; salvar(); fecharSheet(); render(); toast('Desfeito.'); }
const q0 = () => agoraISO();
const ACOES = {
  'tab': el => { S.tab = el.dataset.tab; S.filtro = {}; salvar(); render(); window.scrollTo(0, 0); },
  'guia': el => { esconderBusca(); abrirGuia(el.dataset.id, el.dataset.voltar); },
  'malote': el => { esconderBusca(); abrirMalote(el.dataset.id); },
  'receber': el => abrirReceber(el.dataset.id),
  'fechar': el => abrirFechar(el.dataset.dest),
  'nova': () => abrirNova(),
  'nova-modo': el => { N.modo = el.dataset.v; N.erros = {}; desenharNova(); },
  'ex-prot': el => { const i = $('#n-prot'); if (!i) return; i.value = el.dataset.v; procurarProtocolo(i.value); i.focus(); },
  'entreguei': el => { const g = G(el.dataset.id); agir('Entregue: ' + g.paciente + '.', () => tEntregar(g, q0(), quem())); },
  'reforcei': el => { const g = G(el.dataset.id); agir('Aviso reforçado por ligação: ' + g.paciente + '.', () => tReforcar(g, q0(), quem(), 'ligacao')); },
  'mensagem': el => { esconderBusca(); abrirMensagem(el.dataset.id); },
  'msg-whats': el => mandarMensagem(el.dataset.id),
  'msg-copiar': () => copiarMensagem(),
  'naoretirou': el => { const g = G(el.dataset.id); agir('Não retirou: o Agendamento decide.', () => tNaoRetirou(g, q0(), quem())); },
  'decidir': el => { const g = G(el.dataset.id), v = el.dataset.v; agir(v === 'devolver' ? 'A UBS vai mandar a guia de volta.' : 'Guia arquivada na UBS.', () => tDecidir(g, v, q0(), quem())); },
  'avisei': el => { const g = G(el.dataset.id), v = el.dataset.v; agir(v === 'nao' ? 'Marcado: não atende. A UBS reforça.' : 'Paciente avisado: ' + g.paciente + '.', () => tAvisar(g, v, q0(), quem())); },
  'fila': el => { const g = G(el.dataset.id); agir('Na fila do SIGSS: ' + g.paciente + '.', () => tFila(g, q0(), quem())); },
  'simagendou': el => { const g = G(el.dataset.id); agir('O SIGSS agendou ' + g.paciente + '.', () => tAgendar(g, agFake(g), q0(), quem(), true)); },
  'simcancelou': el => { const g = G(el.dataset.id); agir('O SIGSS cancelou o agendamento de ' + g.paciente + '.', () => tSimCancelou(g, q0())); },
  'achei': el => { const g = G(el.dataset.id); agir('Vai no próximo malote: ' + g.paciente + '.', () => tAchei(g, q0(), quem())); },
  'chegoudepois': el => { const g = G(el.dataset.id); agir('Recebida: ' + g.paciente + '.', () => tChegouDepois(g, q0(), quem())); },
  'retirouag': el => { const g = G(el.dataset.id); agir('Entregue no Agendamento: ' + g.paciente + '.', () => tRetirouAG(g, q0(), quem())); },
  'cancelar': el => { const g = G(el.dataset.id); agir('Guia cancelada: ' + g.paciente + '.', () => tCancelar(g, q0(), quem())); },
  'manual': el => abrirManual(el.dataset.id),
  'problema': el => abrirProblema(el.dataset.id),
  'resolver': el => abrirResolver(el.dataset.id, el.dataset.p),
  'transferir': el => abrirTransferir(el.dataset.id),
  'telefone': el => abrirTelefone(el.dataset.id),
  'naodaqui': el => { R.nao.set(el.dataset.id, ''); R.ok.delete(el.dataset.id); desenharReceber(); const s = document.getElementById('u-' + el.dataset.id); if (s) s.focus(); },
  'naodaqui-x': el => { R.nao.delete(el.dataset.id); R.ok.add(el.dataset.id); desenharReceber(); },
  'novo-abrir': () => { R.form = true; R.erros = {}; desenharReceber(); focar('r-pac'); },
  'novo-cancelar': () => { R.form = false; R.erros = {}; desenharReceber(); },
  'novo-add': () => addNovoReceber(),
  'novo-rm': el => { R.novos.splice(+el.dataset.i, 1); desenharReceber(); },
  'receber-ok': () => receberOk(),
  'fechar-ok': () => fecharOk(),
  'filtro': el => { S.filtro = Object.assign({}, S.filtro, { k: el.dataset.k }); salvar(); render(); },
  'filtro-geral': el => { S.tab = 'guias'; S.filtro = { k: el.dataset.k }; salvar(); render(); window.scrollTo(0, 0); },
  'cel': el => { S.tab = 'guias'; S.filtro = { k: el.dataset.k }; if (el.dataset.u) S.filtro.u = el.dataset.u; salvar(); render(); window.scrollTo(0, 0); },
  'fechar-sheet': () => fecharSheet(),
  'ir': el => { const a = document.getElementById(el.dataset.alvo); if (!a) return; if (a.tagName === 'DETAILS') a.open = true; const suave = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); a.scrollIntoView({ behavior: suave ? 'smooth' : 'auto', block: 'start' }); },
  'imprimir': el => imprimir(el.dataset.id),
  'desfazer': () => desfazer(),
  'tarefas': () => abrirTarefas(),
  'papel-teste': el => { S.papel = el.dataset.v; S.tab = 'fazer'; S.filtro = {}; salvar(); fecharSheet(); render(); window.scrollTo(0, 0); },
  'reset': () => { seed(); salvar(); fecharSheet(); render(); toast('Os dados fictícios voltaram ao início.'); }
};
const MUDAR = {
  'ver-como': el => { S.papel = el.value; S.tab = el.value === ADM ? 'painel' : 'fazer'; S.filtro = {}; salvar(); fecharSheet(); render(); window.scrollTo(0, 0); },
  'conf': el => { const id = el.dataset.id; if (el.checked) R.ok.add(id); else { R.ok.delete(id); R.nao.delete(id); } desenharReceber(); },
  'nao-ubs': el => { R.nao.set(el.dataset.id, el.value); },
  'fsel': el => { const id = el.dataset.id; if (el.checked) F.sel.add(id); else F.sel.delete(id); desenharFechar(); },
  'filtro-ubs': el => { S.filtro = Object.assign({}, S.filtro); if (el.value) S.filtro.u = el.value; else delete S.filtro.u; salvar(); render(); }
};
const ENVIAR = {
  'nova-ok': () => novaOk(),
  'manual-ok': () => {
    const g = G(sheetAtual.id); const dt = valor('a-data'), hr = valor('a-hora'), lc = valor('a-local'), tel = valor('a-tel'); const er = {};
    if (!dt) er.data = 'Escolha a data.'; if (!hr) er.hora = 'Escolha a hora.'; if (!lc) er.local = 'Escreva o local.'; if (!tel) er.tel = 'Escreva o telefone.';
    if (Object.keys(er).length) { abrirManual(g.id, er); return; }
    agir('Agendamento lançado à mão: ' + g.paciente + '.', () => { g.tel = tel; tAgendar(g, { quando: new Date(dt + 'T' + hr).toISOString(), local: lc }, q0(), quem(), false); }, () => voltarParaGuia(g.id));
  },
  'prob-ok': () => {
    const g = G(sheetAtual.id); const r = document.querySelector('.sheet input[name="motivo"]:checked'); const motivo = r ? r.value : 'Outro'; const txt = valor('pb-txt');
    if (motivo === 'Outro' && !txt) { abrirProblema(g.id, 'Escreva qual é o problema.'); return; }
    agir('Problema marcado: ' + motivo + '.', () => { g.problemas.push(prob(motivo, txt || motivo, q0(), quem(), false)); ev(g, q0(), quem(), 'Problema marcado: ' + motivo + (txt ? '. ' + txt : '')); }, () => voltarParaGuia(g.id));
  },
  'resolver-ok': () => {
    const g = G(sheetAtual.id); const p = g.problemas.find(x => x.id === sheetAtual.pid); const txt = valor('rs-txt');
    if (!txt) { abrirResolver(g.id, p.id, 'Escreva o que foi feito. Isso fica na linha do tempo.'); return; }
    agir('Problema resolvido.', () => { resolverProb(p, txt, q0(), quem()); ev(g, q0(), quem(), 'Problema resolvido (' + p.motivo + '): ' + txt); }, () => voltarParaGuia(g.id));
  },
  'transf-ok': () => {
    const g = G(sheetAtual.id); const u = valor('tr-ubs'); if (!u) { abrirTransferir(g.id, 'Escolha a UBS nova.'); return; }
    agir('Transferida para a UBS ' + nomeUn(u) + '.', () => tTransferir(g, u, q0(), quem()), () => voltarParaGuia(g.id));
  },
  'tel-ok': () => { const g = G(sheetAtual.id); const t = valor('tl-num'); agir('Telefone salvo.', () => { g.tel = t; ev(g, q0(), quem(), t ? 'Telefone atualizado' : 'Telefone apagado'); }, () => voltarParaGuia(g.id)); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('.busca')) esconderBusca();
  if (!el || el.matches('input,select')) return;
  const fn = ACOES[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => { const el = e.target; const fn = el.dataset && MUDAR[el.dataset.act]; if (fn) fn(el); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'busca') buscar(el.value);
  if (el.id === 'n-prot') procurarProtocolo(el.value);
});
document.addEventListener('submit', e => { e.preventDefault(); const fn = ENVIAR[e.target.dataset.submit]; if (fn) fn(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#sheet .sheet')) fecharSheet(); else esconderBusca(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});

S = carregar(); if (!S) { seed(); salvar(); }
render();
})();
